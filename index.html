<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kidoodle Studio</title>
<style>
:root{--bg:#e9eeff;--surface:#fff;--surface-2:#f3f5ff;--ink:#241f4d;--ink-soft:#4a4678;--line:#d3d9f5;--accent:#ff4f7b;--accent-ink:#fff;--sun:#ffc21a;--shadow:rgba(36,31,77,.16);--press:#b9c3ee;--ok:#34c759;--warn:#ffcc00;--err:#ff3b30;--font:"Fredoka","Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14112c;--surface:#241f4d;--surface-2:#2e2862;--ink:#f4f1ff;--ink-soft:#c4bdf0;--line:#3d3680;--accent:#ff6b92;--accent-ink:#1b1233;--sun:#ffd44d;--shadow:rgba(0,0,0,.45);--press:#17133a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14112c;--surface:#241f4d;--surface-2:#2e2862;--ink:#f4f1ff;--ink-soft:#c4bdf0;--line:#3d3680;--accent:#ff6b92;--accent-ink:#1b1233;--sun:#ffd44d;--shadow:rgba(0,0,0,.45);--press:#17133a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:8px;padding:8px 12px;max-width:1500px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;min-width:0}
.logo{font-weight:700;font-size:1.5rem;display:flex;align-items:baseline;gap:6px;flex:none;line-height:1;cursor:pointer;user-select:none;-webkit-user-select:none}
.logo b{display:inline-flex}
.logo b i{font-style:normal;display:inline-block;transform:translateY(var(--dy,0)) rotate(var(--rot,0deg))}
.logo small{font-size:.72rem;color:var(--ink-soft);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.actions{display:flex;gap:6px;margin-left:auto;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;min-width:0}
.actions::-webkit-scrollbar{display:none}
.btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:none;min-width:54px;height:52px;padding:4px 10px;border:0;border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--press),0 6px 12px var(--shadow);font-size:.72rem;font-weight:600;transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn .ic{font-size:1.35rem;line-height:1}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--press),0 2px 4px var(--shadow)}
.btn:disabled{opacity:.4;cursor:default}
.btn.hot{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 #c2214d,0 6px 12px var(--shadow)}
.btn.on{background:var(--sun);color:#3a2a00;box-shadow:0 4px 0 #c99200,0 6px 12px var(--shadow)}
.work{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;min-height:0}
.rail{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:88px;padding:4px 4px 8px;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tool{position:relative;border:3px solid transparent;border-radius:20px;background:var(--surface);box-shadow:0 4px 0 var(--press),0 6px 12px var(--shadow);padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.7rem;font-weight:600;min-height:64px;flex:none;transition:transform .08s,box-shadow .08s}
.tool .ic{font-size:1.7rem;line-height:1.1}
.tool canvas{width:72px;height:28px;border-radius:8px;background:#fff}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press),0 2px 4px var(--shadow)}
.tool.active{border-color:var(--accent);background:var(--surface-2)}
.tool.active::after{content:"";position:absolute;right:-8px;top:50%;width:9px;height:22px;margin-top:-11px;border-radius:0 6px 6px 0;background:var(--accent)}
.sizebox{background:var(--surface);border-radius:20px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;font-weight:600;box-shadow:0 4px 0 var(--press),0 6px 12px var(--shadow);flex:none}
.dotwrap{width:46px;height:46px;display:grid;place-items:center;background:var(--surface-2);border-radius:50%}
#sizeDot{border-radius:50%;background:var(--ink);max-width:42px;max-height:42px}
.sizebox input{width:72px;accent-color:var(--accent);height:26px}
.stagewrap{position:relative;min-width:0;min-height:0;display:grid;place-items:center}
.stage{position:relative;background:#fff;border-radius:16px;box-shadow:0 0 0 6px var(--surface),0 12px 26px var(--shadow);touch-action:none;overflow:hidden;cursor:crosshair}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#lines{pointer-events:none}
#onion{pointer-events:none;opacity:.15}
#ring{position:absolute;border:2px solid #000;box-shadow:0 0 0 2px #fff;border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%)}
#hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#b7b3d6;font-size:clamp(1.2rem,3vw,2rem);font-weight:600;text-align:center;transition:opacity .3s;padding:20px}
#hint[hidden]{display:none!important}
.stage.dragover{box-shadow:0 0 0 6px var(--accent),0 12px 26px var(--shadow)}
.mbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:var(--surface);padding:8px 10px 8px 18px;border-radius:40px;box-shadow:0 8px 20px var(--shadow);z-index:6;font-weight:600;font-size:.9rem}
.mbar[hidden]{display:none!important}
.mbar .rec{width:10px;height:10px;border-radius:50%;background:var(--err);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.palette{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border-radius:22px;padding:8px 12px;box-shadow:0 6px 18px var(--shadow)}
.cur{display:flex;align-items:center;gap:8px;min-width:100px}
#curSwatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 3px var(--ink),0 3px 6px var(--shadow);flex:none}
#curName{font-weight:700;font-size:.92rem;line-height:1.1;max-width:100px}
.swatches{display:grid;grid-template-rows:repeat(2,32px);grid-auto-flow:column;grid-auto-columns:32px;gap:6px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:thin;min-width:0}
.sw{width:32px;height:32px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14);position:relative}
.sw[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--ink)}
.mix{display:grid;place-items:center;font-size:.7rem;font-weight:600}
.mix input{width:48px;height:36px;border:0;padding:0;background:none;border-radius:12px;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(20,17,44,.55);display:grid;place-items:center;padding:12px;z-index:20;backdrop-filter:blur(3px)}
#modal[hidden]{display:none!important}
.sheet{background:var(--surface);border-radius:24px;width:min(980px,100%);max-height:min(94%,900px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
.sheet.narrow{width:min(540px,100%)}
.sheet:focus{outline:none}
.sheet h2{margin:0;font-size:1.3rem;font-weight:700}
.sheet header{display:flex;align-items:center;gap:12px;padding:12px 16px 6px}
.sheet header .x{margin-left:auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);font-size:1.3rem;font-weight:700}
.sheet .body{padding:4px 16px 18px;overflow-y:auto;min-height:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;border:0;border-radius:26px;padding:8px 14px;background:var(--surface-2);font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.card{border:3px solid transparent;border-radius:18px;background:var(--surface-2);padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;font-weight:600;font-size:.85rem;position:relative;text-decoration:none;color:inherit;text-align:center}
.card img,.card canvas{width:100%;height:auto;border-radius:10px;background:#fff;display:block;aspect-ratio:4/3;object-fit:contain}
.card[aria-pressed="true"]{border-color:var(--accent)}
.card:active{transform:scale(.97)}
.card .del{position:absolute;top:2px;right:2px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);box-shadow:0 2px 6px var(--shadow);font-size:1rem}
.card .ttl{border:0;background:transparent;font:inherit;color:inherit;text-align:center;width:100%;padding:4px 2px;border-radius:6px;font-size:.82rem}
.card .ttl:focus{background:var(--surface);outline:2px solid var(--accent)}
.emojis{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(60px,1fr))}
.emo{border:3px solid transparent;border-radius:14px;background:var(--surface-2);font-size:2rem;line-height:1;padding:8px 0}
.emo[aria-pressed="true"]{border-color:var(--accent)}
.bigbtns{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.big{border:0;border-radius:20px;padding:16px 10px;background:var(--surface-2);font-weight:700;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 var(--press);text-decoration:none;color:inherit}
.big .ic{font-size:2.2rem}
.big.hot{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 #c2214d}
.big[aria-pressed="true"]{outline:3px solid var(--accent)}
.big canvas{width:100%;max-width:120px;border-radius:10px}
.note{color:var(--ink-soft);font-size:.9rem;margin:10px 2px 0;line-height:1.45}
.empty{text-align:center;padding:26px 10px;color:var(--ink-soft);font-size:1rem}
.empty .ic{font-size:2.8rem;display:block;margin-bottom:4px}
.hero{text-align:center;padding:4px 0 12px}
.hero h1{font-size:clamp(1.8rem,6vw,2.8rem);margin:0 0 4px;line-height:1.05}
.hero p{margin:0;color:var(--ink-soft);font-size:1rem}
.home-grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.home-grid{grid-template-columns:repeat(4,1fr)}}
.home-card{border:0;border-radius:22px;padding:22px 10px;background:var(--surface-2);font-weight:700;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--press);color:inherit;text-decoration:none;cursor:pointer}
.home-card .ic{font-size:3rem;line-height:1}
.home-card small{font-size:.78rem;font-weight:600;color:var(--ink-soft)}
.home-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--press)}
.home-card.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 #c2214d}
.home-card.primary small{color:rgba(255,255,255,.85)}
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:26px;font-weight:600;font-size:.9rem;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 24px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#savePill{position:fixed;top:12px;right:12px;background:var(--surface);padding:6px 14px;border-radius:22px;display:flex;align-items:center;gap:8px;font:600 12px system-ui;box-shadow:0 4px 12px var(--shadow);z-index:15;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none;color:var(--ink)}
#savePill.show{opacity:1;transform:translateY(0)}
#savePill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
#savePill.saving .dot{background:var(--warn);animation:blink .9s infinite}
#savePill.error{pointer-events:auto;cursor:pointer}
#savePill.error .dot{background:var(--err)}
#uploadPv{width:100%;border-radius:14px;background:#fff;border:3px solid var(--line);display:block;aspect-ratio:4/3;object-fit:contain}
.uprow{display:flex;align-items:center;gap:12px;font-weight:600;font-size:.9rem}
.uprow>span{min-width:100px}
.uprow>input[type=range]{flex:1;accent-color:var(--accent);height:26px}
.modeBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.mode{border:3px solid transparent;border-radius:16px;padding:10px 6px;background:var(--surface-2);font-weight:700;font-size:.88rem;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--press)}
.mode .ic{font-size:1.7rem;line-height:1}
.mode[aria-pressed="true"]{border-color:var(--accent);background:#fff5f9}
:root[data-theme="dark"] .mode[aria-pressed="true"]{background:#3a1f3f}
#abar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--surface);border-radius:20px;padding:8px 10px;box-shadow:0 6px 18px var(--shadow);font-size:.8rem;font-weight:600}
#abar[hidden]{display:none!important}
.abar-group{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.abar-btn{border:0;border-radius:12px;background:var(--surface-2);padding:8px 10px;font:inherit;font-weight:600;font-size:.8rem;min-width:38px;display:flex;flex-direction:column;align-items:center;gap:1px}
.abar-btn .ic{font-size:1.1rem;line-height:1}
.abar-btn:active{transform:translateY(2px)}
.abar-btn:disabled{opacity:.4}
.abar-btn.hot{background:var(--accent);color:var(--accent-ink)}
.abar-label{text-align:center;font-weight:700;font-size:.85rem;color:var(--ink)}
.abar-label small{display:block;font-weight:500;font-size:.72rem;color:var(--ink-soft)}
#animSlider{width:80px;accent-color:var(--accent)}
.sr-file{position:fixed;left:0;top:0;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;opacity:0;z-index:-1;pointer-events:auto}
@media(max-width:820px){.logo small{display:none}.logo{font-size:1.2rem}.btn{min-width:48px;padding:3px 6px;height:46px}.btn .ic{font-size:1.2rem}.work{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:6px}.rail{flex-direction:row;width:auto;overflow-x:auto;overflow-y:hidden;padding:4px 4px 8px}.rail .tool,.rail .sizebox{flex:none;min-width:76px}.tool.active::after{display:none}.sizebox{flex-direction:row;padding:4px 10px}.palette{grid-template-columns:minmax(0,1fr) auto;padding:6px 8px}.cur{display:none}.swatches{grid-auto-columns:30px;grid-template-rows:repeat(2,30px)}.sw{width:30px;height:30px}.home-grid{grid-template-columns:repeat(2,1fr)}#app{grid-template-rows:auto minmax(0,1fr) auto auto;padding:6px 8px;gap:6px}#savePill{top:8px;right:8px;padding:5px 10px;font-size:11px}}
@media(max-height:560px){.btn{height:44px}.btn .ic{font-size:1.1rem}.btn span:last-child{display:none}.logo small{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo" id="logoBtn" aria-label="Kidoodle Studio — long press for parent menu"><b id="logoLetters"></b><small>Studio</small></div>
    <nav class="actions" aria-label="Main actions">
      <button class="btn" id="bHome" title="Home"><span class="ic">🏠</span><span>Home</span></button>
      <button class="btn" id="bPages" title="Colouring pages"><span class="ic">📖</span><span>Pictures</span></button>
      <button class="btn" id="bNew" title="Blank paper"><span class="ic">📄</span><span>Blank</span></button>
      <label for="fileIn" class="btn" id="bUpload" role="button" tabindex="0" title="Use your own photo"><span class="ic">📷</span><span>Upload</span></label>
      <button class="btn" id="bUndo" title="Undo"><span class="ic">↩️</span><span>Undo</span></button>
      <button class="btn" id="bRedo" title="Redo"><span class="ic">↪️</span><span>Redo</span></button>
      <button class="btn" id="bClear" title="Start over"><span class="ic">🗑️</span><span>Clear</span></button>
      <button class="btn" id="bMovie" title="Watch it being drawn"><span class="ic">🎬</span><span>Movie</span></button>
      <button class="btn" id="bAnimate" title="Make a cartoon"><span class="ic">🎞️</span><span>Animate</span></button>
      <button class="btn hot" id="bSave" title="Save my picture"><span class="ic">💾</span><span>Save</span></button>
      <button class="btn" id="bGallery" title="My Art"><span class="ic">🖼️</span><span>My Art</span></button>
      <button class="btn on" id="bSound" title="Sounds"><span class="ic">🔊</span><span>Sound</span></button>
      <button class="btn" id="bVoice" title="Say colour names"><span class="ic">🗣️</span><span>Voice</span></button>
    </nav>
  </header>
  <main class="work">
    <aside class="rail" aria-label="Tools">
      <button class="tool active" id="tBrush" data-tool="brush"><canvas id="brushPrev" width="144" height="56"></canvas><span id="brushName">Marker</span></button>
      <button class="tool" id="tFill" data-tool="fill"><span class="ic">🪣</span><span id="fillName">Fill</span></button>
      <button class="tool" id="tEraser" data-tool="eraser"><span class="ic">🧽</span><span>Rub out</span></button>
      <button class="tool" id="tStamp" data-tool="stamp"><span class="ic" id="stampIc">🐶</span><span>Stickers</span></button>
      <button class="tool" id="tSym" data-tool="sym"><span class="ic" id="symIc">▫️</span><span id="symName">Mirror: off</span></button>
      <div class="sizebox"><div class="dotwrap"><div id="sizeDot"></div></div><input type="range" id="size" min="4" max="60" value="14" aria-label="Brush size"><span>Size</span></div>
    </aside>
    <section class="stagewrap" id="stagewrap">
      <div class="stage" id="stage">
        <canvas id="art" width="1000" height="750"></canvas>
        <canvas id="onion" width="1000" height="750"></canvas>
        <canvas id="lines" width="1000" height="750"></canvas>
        <div id="hint">Draw here with your finger or mouse!<br>Tap 📖 Pictures or 📷 Upload to start.</div>
        <div id="ring"></div>
      </div>
      <div class="mbar" id="mbar" hidden><span class="rec"></span><span id="mmsg">Playing your movie…</span><button class="btn hot" id="mStop" style="height:40px;flex-direction:row;gap:4px">⏹ Stop</button></div>
    </section>
  </main>
  <div id="abar" hidden>
    <div class="abar-group">
      <button class="abar-btn" id="aPrev" title="Previous frame"><span class="ic">◀</span></button>
      <button class="abar-btn" id="aNext" title="Next frame"><span class="ic">▶</span></button>
    </div>
    <div class="abar-label"><span id="aFrameLabel">Frame 1/1</span><small id="aFpsLabel">8 frames per second</small></div>
    <div class="abar-group">
      <button class="abar-btn" id="aAdd" title="New frame"><span class="ic">＋</span><span>Add</span></button>
      <button class="abar-btn" id="aDup" title="Duplicate frame"><span class="ic">⧉</span><span>Dup</span></button>
      <button class="abar-btn" id="aDel" title="Delete frame"><span class="ic">🗑</span><span>Del</span></button>
      <button class="abar-btn hot" id="aPlay" title="Play animation"><span class="ic">▶</span><span>Play</span></button>
      <button class="abar-btn" id="aExport" title="Export as video"><span class="ic">🎞</span><span>Export</span></button>
      <button class="abar-btn" id="aExit" title="Leave animation"><span class="ic">✖</span><span>Done</span></button>
    </div>
  </div>
  <footer class="palette">
    <div class="cur"><div id="curSwatch"></div><div id="curName">Red</div></div>
    <div class="swatches" id="swatches" role="group" aria-label="Colours"></div>
    <label class="mix" title="Mix your own colour"><input type="color" id="mix" value="#ff3b30" aria-label="Mix a colour"><span>Mix</span></label>
  </footer>
</div>
<input type="file" id="fileIn" accept="image/*" class="sr-file" tabindex="-1" aria-hidden="true">
<div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="savePill" role="status" aria-live="polite"><span class="dot"></span><span class="msg">Saved</span></div>

<script>
'use strict';
/* ============ PAGES LIBRARY ============ */
const PAGE_W=1000,PAGE_H=750,PAGES=[],CATS=[['Animals','🐾'],['Vehicles','🚗'],['Nature','🌸'],['Food','🍓'],['Fantasy','🦄'],['Things','🎈'],['Scenes','🏞️'],['Mandalas','🌀'],['ABC','🔤'],['123','🔢']];
function P(id,name,cat,draw){PAGES.push({id,name,cat,draw})}
function Gfx(ctx){const g={ctx,s:1},LW=7;const rd=lw=>{ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle='#000';ctx.fillStyle='#fff';ctx.lineWidth=(lw||LW)/g.s};const paint=(p,nf,lw)=>{rd(lw);if(!nf)ctx.fill(p);ctx.stroke(p)};
g.d=(d,nf,lw)=>paint(new Path2D(d),nf,lw);g.l=(d,lw)=>paint(new Path2D(d),1,lw);

g.p=(pts,nf)=>{const p=new Path2D();p.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)p.lineTo(pts[i],pts[i+1]);p.closePath();paint(p,nf)};

g.whiskers=(x,y,w)=>{g.l(`M${x-40} ${y}L${x-40-w} ${y-20}M${x-40} ${y+18}L${x-40-w} ${y+28}M${x+40} ${y}L${x+40+w} ${y-20}M${x+40} ${y+18}L${x+40+w} ${y+28}`)};
g.grass=(y)=>{g.l(`M0 ${y}`+Array.from({length:21},(_,i)=>`Q${i*50+25} ${y-28} ${i*50+50} ${y}`).join(''))};
g.waves=(y,amp)=>{amp=amp||18;g.l(`M0 ${y}`+Array.from({length:11},(_,i)=>`Q${i*100+50} ${y-amp*2} ${i*100+100} ${y}`).join(''))};
return g}

function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function rgba(rgb,a){return`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`}
function mixRgb(a,b,t){return[Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)]}

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,slide,delay){if(!S.sound)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(60,f+slide),t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
const sfx={pick(){tone(660,.08,'triangle',.1)},fill(){tone(440,.1,'sine',.14,300);tone(660,.14,'sine',.12,300,.07)},stamp(){tone(300,.18,'sine',.16,400)},undo(){tone(500,.12,'triangle',.1,-250)},tada(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.12,0,i*.09))},pop(){tone(820,.05,'square',.04)},frame(){tone(600,.06,'square',.06)}};
function say(t){if(!S.voice)return;if(localStorage.getItem('kd.voiceLocked')==='1')return;try{const u=new SpeechSynthesisUtterance(t);u.rate=.9;u.pitch=1.2;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function nearestName(hex){const[r,g,b]=hexToRgb(hex);let best=null,bd=1e9;for(const[h,n]of COLORS){const[r2,g2,b2]=hexToRgb(h),d=(r-r2)**2+(g-g2)**2+(b-b2)**2;if(d<bd){bd=d;best=n}}return best}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800)}

const savePill=$('#savePill');
function saveSet(st,msg){if(!savePill)return;if(st==='hide'){savePill.classList.remove('show');return}savePill.className='show';if(st==='saving'){savePill.classList.add('saving');savePill.querySelector('.msg').textContent='Saving…'}else if(st==='saved'){savePill.querySelector('.msg').textContent='Saved ✓';clearTimeout(savePill._h);savePill._h=setTimeout(()=>savePill.classList.remove('show'),2200)}else if(st==='error'){savePill.classList.add('error');savePill.querySelector('.msg').textContent=msg||'Not saved — Tap to retry'}}

function fit(){const w=wrap.clientWidth,h=wrap.clientHeight-6;if(w<10||h<10)return;const s=Math.min((w-12)/W,(h-12)/H);stage.style.width=Math.floor(W*s)+'px';stage.style.height=Math.floor(H*s)+'px';updateDot()}

const scaleCss=()=>stage.clientWidth/W;
function buildPalette(){const box=$('#swatches');box.innerHTML='';COLORS.forEach(([hex,name])=>{const b=document.createElement('button');b.className='sw';b.style.background=hex;b.title=name;b.setAttribute('aria-label',name);b.dataset.hex=hex;b.addEventListener('click',()=>setColor(hex,name));box.appendChild(b)})}
function setColor(hex,name,quiet){S.color=hex;name=name||nearestName(hex);$('#curSwatch').style.background=hex;$('#curName').textContent=name;$('#mix').value=hex.length===7?hex:'#000';document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.hex===hex)));if(!quiet){sfx.pick();say(name);if(S.tool==='eraser'||S.tool==='sym')setTool('brush')}updateBrushPreview();updateDot();saveSettings()}
$('#mix').addEventListener('input',e=>setColor(e.target.value));
function setTool(t){S.tool=t;document.querySelectorAll('.tool[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));updateCursorRing()}
function updateDot(){const px=clamp(S.size*(S.tool==='eraser'?1.6:1)*scaleCss()*1.6,6,46),d=$('#sizeDot');d.style.width=d.style.height=px+'px';d.style.background=S.tool==='eraser'?'#999':S.color}
$('#size').addEventListener('input',e=>{S.size=+e.target.value;updateDot();updateBrushPreview();updateCursorRing();saveSettings()});
function previewOn(cv,brushId,size,color){const c=cv.getContext('2d'),w=cv.width,h=cv.height;c.clearRect(0,0,w,h);c.fillStyle='#fff';c.fillRect(0,0,w,h);const[r,g,b]=hexToRgb(color),lum=(r*.3+g*.59+b*.11);if(lum>235)color='#7a74b8';const s=new Stroke(c,{b:brushId,c:color,z:size,sym:0,seed:12345,e:S.stamp},w,h);c.save();c.beginPath();c.rect(0,0,w,h);c.clip();for(let i=0;i<=44;i++){const t=i/44;s.point(w*.08+t*w*.84,h/2+Math.sin(t*6.3)*h*.22)}c.restore()}
function updateBrushPreview(){const b=BRUSH_BY_ID[S.brush];$('#brushName').textContent=b.name;previewOn($('#brushPrev'),S.brush,Math.min(S.size,14)*1.1,S.color)}
function updateCursorRing(){const r=$('#ring'),px=(S.tool==='stamp'?S.size*3+26:S.tool==='eraser'?S.size*2.2:S.size)*scaleCss();r.style.width=r.style.height=Math.max(8,px)+'px'}

// History
const snap=()=>actx.getImageData(0,0,W,H);
function commit(act,before){S.undo.push({img:before,act});if(S.undo.length>18)S.undo.shift();S.redo=[];S.actions.push(act);refreshUI();scheduleSave()}
function doUndo(){if(replaying||!S.undo.length)return;const e=S.undo.pop();S.redo.push({img:snap(),act:e.act});actx.putImageData(e.img,0,0);S.actions.pop();sfx.undo();refreshUI();scheduleSave()}
function doRedo(){if(replaying||!S.redo.length)return;const e=S.redo.pop();S.undo.push({img:snap(),act:e.act});actx.putImageData(e.img,0,0);S.actions.push(e.act);sfx.undo();refreshUI();scheduleSave()}
function refreshUI(){$('#bUndo').disabled=!S.undo.length||S.animation;$('#bRedo').disabled=!S.redo.length||S.animation;$('#hint').hidden=S.actions.length>0||S.page!=='blank'||S.animation;$('#bSound').querySelector('.ic').textContent=S.sound?'🔊':'🔇';$('#bSound').classList.toggle('on',S.sound);$('#bVoice').classList.toggle('on',S.voice&&localStorage.getItem('kd.voiceLocked')!=='1');$('#bVoice').disabled=localStorage.getItem('kd.voiceLocked')==='1';$('#fillName').textContent=S.fillStyle==='solid'?'Fill':FILL_STYLES.find(f=>f.id===S.fillStyle).name;$('#symIc').textContent=SYMS[S.sym].icon;$('#symName').textContent=S.sym?SYMS[S.sym].name:'Mirror: off';$('#stampIc').textContent=S.stamp}

// Drawing input
let activePtr=null,curStroke=null,strokeBefore=null;
function toLocal(e){const r=art.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
let lastReject={x:-1,y:-1,time:0};
function doFillAt(p){const before=snap();const res=floodFill(actx,LA,p.x,p.y,S.color,S.fillStyle);if(res.ok){commit({t:'f',x:Math.round(p.x),y:Math.round(p.y),c:S.color,p:S.fillStyle},before);sfx.fill()}else if(res.reason==='huge'){const now=Date.now();if(lastReject.x===Math.round(p.x)&&lastReject.y===Math.round(p.y)&&now-lastReject.time<3000){actx.putImageData(before,0,0);const res2=floodFill(actx,LA,p.x,p.y,S.color,S.fillStyle,true);if(res2.ok){commit({t:'f',x:Math.round(p.x),y:Math.round(p.y),c:S.color,p:S.fillStyle},before);sfx.fill();lastReject={x:-1,y:-1,time:0}}}else{lastReject={x:Math.round(p.x),y:Math.round(p.y),time:now};toast('That would fill the whole page. Tap again to do it anyway.')}}}
stage.addEventListener('pointerdown',e=>{
  if(replaying||activePtr!==null||(e.pointerType==='mouse'&&e.button!==0))return;
  e.preventDefault();ac();
  const p=toLocal(e);
  if(S.animPlaying){return}
  if(S.tool==='fill'){doFillAt(p);return}
  activePtr=e.pointerId;try{stage.setPointerCapture(e.pointerId)}catch(x){}
  strokeBefore=snap();
  const b=S.tool==='eraser'?'eraser':S.tool==='stamp'?'stamp':S.brush;
  curStroke=new Stroke(actx,{b,c:S.color,z:S.size,sym:S.sym,seed:Math.floor(Math.random()*1e9),e:S.stamp});
  curStroke.point(p.x,p.y);if(b==='stamp')sfx.stamp();
});
stage.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){const r=stage.getBoundingClientRect(),ring=$('#ring');ring.style.display=replaying||S.animPlaying?'none':'block';ring.style.left=(e.clientX-r.left)+'px';ring.style.top=(e.clientY-r.top)+'px'}
  if(e.pointerId!==activePtr||!curStroke)return;
  e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of(evs.length?evs:[e])){const p=toLocal(ev);curStroke.point(p.x,p.y)}
});
function endStroke(e){if(e.pointerId!==activePtr)return;activePtr=null;if(!curStroke)return;const s=curStroke;curStroke=null;commit({t:'s',b:s.p.b,c:s.p.c,z:s.p.z,sym:s.p.sym,seed:s.p.seed,e:s.p.e,pts:s.pts},strokeBefore)}
stage.addEventListener('pointerup',endStroke);stage.addEventListener('pointercancel',endStroke);
stage.addEventListener('pointerleave',()=>{$('#ring').style.display='none'});
stage.addEventListener('contextmenu',e=>e.preventDefault());

// Page loading
async function loadPage(id){S.page=id;lctx.clearRect(0,0,W,H);LA=null;if(id==='blank'||id==='upload')return;const pg=PAGES.find(p=>p.id===id);if(!pg){S.page='blank';return}try{await Promise.race([document.fonts.load(LETTER_FONT.replace('560px','100px'),'A'),new Promise(r=>setTimeout(r,1500))])}catch(e){}const r=renderPageLines(pg);lctx.drawImage(r.canvas,0,0);LA=r.alpha;refreshUI()}
async function newPicture(pageId){if(replaying)return;await saveNow();S.id=null;S.actions=[];S.undo=[];S.redo=[];S.title='';actx.clearRect(0,0,W,H);await loadPage(pageId||'blank');if(pageId&&pageId!=='blank')setTool('fill');refreshUI()}

/* ============ DB (v2 schema) ============ */
const DB={
  mem:new Map(),dbp:null,
  open(){if(this.dbp)return this.dbp;this.dbp=new Promise(res=>{try{if(typeof indexedDB==='undefined'||!indexedDB){res(null);return}const rq=indexedDB.open('kidoodle-studio',1);rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('art',{keyPath:'id'})}catch(e){}};rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);rq.onblocked=()=>res(null)}catch(e){res(null)}});return this.dbp},
  async tx(mode,fn){const db=await this.open();if(!db)return null;return new Promise((res,rej)=>{try{const t=db.transaction('art',mode),st=t.objectStore('art'),rq=fn(st);t.oncomplete=()=>res(rq?rq.result:true);t.onerror=()=>rej(t.error||new Error('tx failed'));t.onabort=()=>rej(t.error||new Error('tx aborted'))}catch(e){rej(e)}})},
  async put(rec){this.mem.set(rec.id,rec);try{await this.tx('readwrite',s=>s.put(rec));return true}catch(e){console.warn('[DB.put]',e&&e.name,e&&e.message);if(e&&(e.name==='QuotaExceededError'||e.code===22)){const err=new Error('quota');err.name='QuotaExceededError';throw err}return false}},
  async all(){try{const r=await this.tx('readonly',s=>s.getAll());return(r||[...this.mem.values()]).sort((a,b)=>b.ts-a.ts)}catch(e){return[...this.mem.values()].sort((a,b)=>b.ts-a.ts)}},
  async del(id){this.mem.delete(id);try{await this.tx('readwrite',s=>s.delete(id))}catch(e){}},
  async clear(){this.mem.clear();try{await this.tx('readwrite',s=>s.clear())}catch(e){}}
};
let saveTimer=null,saving=Promise.resolve();
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,700)}
function composite(w,h){const cv=document.createElement('canvas');cv.width=w||W;cv.height=h||H;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.drawImage(art,0,0,cv.width,cv.height);c.drawImage(lines,0,0,cv.width,cv.height);return cv}
const toBlob=(cv,type,q)=>new Promise(r=>{try{cv.toBlob(r,type,q)}catch(e){r(null)}});

function saveNow(){
  clearTimeout(saveTimer);
  if(!S.actions.length&&!S.id&&S.page!=='upload'&&!S.title)return saving;
  saveSet('saving');
  saving=saving.then(async()=>{
    try{
      if(!S.id)S.id='art'+Date.now();
      const png=await toBlob(art,'image/png');
      const rec={id:S.id,ts:Date.now(),page:S.page,v:2,title:S.title||'',thumb:composite(240,180).toDataURL('image/jpeg',.75),png,actions:S.actions.slice()};
      if(S.page==='upload'){rec.lines=lines.toDataURL('image/png');rec.mode=LA?'color':'trace'}
      const ok=await DB.put(rec);
      saveSet(ok?'saved':'error',ok?null:'Could not save — Tap to retry');
    }catch(e){
      console.error('[save]',e);
      if(e&&e.name==='QuotaExceededError'){saveSet('error','Storage full — delete old drawings')}
      else{saveSet('error','Could not save — Tap to retry')}
    }
  });
  return saving;
}

async function openRecord(rec){
  if(replaying)return;await saveNow();
  S.id=rec.id;S.actions=rec.actions||[];S.undo=[];S.redo=[];S.title=rec.title||'';
  await loadPage(rec.page||'blank');
  if(rec.page==='upload'&&rec.lines){try{await loadLinesFromDataURL(rec.lines)}catch(e){};if(rec.mode!=='color')LA=null}
  actx.clearRect(0,0,W,H);
  try{const bm=await createImageBitmap(rec.png);actx.drawImage(bm,0,0)}catch(e){}
  setTool('brush');refreshUI();
}

async function savePicture(){
  await saveNow();
  if(savePill.classList.contains('error')){toast('Still trying to save… please retry first.');return}
  const blob=await toBlob(composite(),'image/png');
  if(!blob){toast('Could not save this picture.');return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kidoodle-'+(S.title||new Date().toISOString().slice(0,10))+'.png';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}catch(e){}
  sfx.tada();toast('Saved to My Art ✓')
}

/* ============ ANIMATION ============ */
S.animation=false;S.animFrames=[];S.animCurrent=0;S.animPlaying=false;S.animFps=8;
function animShowBar(show){$('#abar').hidden=!show}
function animUpdateLabel(){const n=S.animFrames.length||1;$('#aFrameLabel').textContent=`Frame ${S.animCurrent+1}/${n}`;$('#aFpsLabel').textContent=`${S.animFps} frames per second`}
function animSaveFrame(){if(S.animFrames[S.animCurrent])actx.putImageData(S.animFrames[S.animCurrent],0,0)}
function animCaptureCurrent(){S.animFrames[S.animCurrent]=actx.getImageData(0,0,W,H)}
function animDrawOnion(){octx.clearRect(0,0,W,H);if(!S.animation)return;const prevIdx=S.animCurrent-1;if(prevIdx>=0&&S.animFrames[prevIdx]){octx.putImageData(S.animFrames[prevIdx],0,0);onion.style.display='block'}else{onion.style.display='none'}}
function animGoto(idx){if(idx<0||idx>=S.animFrames.length)return;animSaveFrame();S.animCurrent=idx;actx.clearRect(0,0,W,H);actx.putImageData(S.animFrames[idx],0,0);S.undo=[];S.redo=[];S.actions=[];animDrawOnion();animUpdateLabel();refreshUI();sfx.frame()}
function animAddFrame(){animSaveFrame();S.animFrames.push(actx.createImageData(W,H));S.animCurrent=S.animFrames.length-1;actx.clearRect(0,0,W,H);S.undo=[];S.redo=[];S.actions=[];animDrawOnion();animUpdateLabel();refreshUI();sfx.frame();toast('New frame')}
function animDupFrame(){animSaveFrame();const src=S.animFrames[S.animCurrent];const dup=actx.createImageData(W,H);dup.data.set(src.data);S.animFrames.push(dup);S.animCurrent=S.animFrames.length-1;animDrawOnion();animUpdateLabel();refreshUI();sfx.frame();toast('Duplicated')}
function animDelFrame(){if(S.animFrames.length<=1){toast('Need at least one frame');return}animSaveFrame();S.animFrames.splice(S.animCurrent,1);if(S.animCurrent>=S.animFrames.length)S.animCurrent=S.animFrames.length-1;actx.clearRect(0,0,W,H);actx.putImageData(S.animFrames[S.animCurrent],0,0);animDrawOnion();animUpdateLabel();refreshUI();sfx.frame()}
async function animPlay(){if(S.animPlaying)return;animSaveFrame();S.animPlaying=true;const frames=S.animFrames.slice();octx.clearRect(0,0,W,H);onion.style.display='none';for(let i=0;i<frames.length;i++){if(!S.animPlaying)break;actx.putImageData(frames[i],0,0);await new Promise(r=>setTimeout(r,1000/S.animFps))}S.animPlaying=false;actx.clearRect(0,0,W,H);actx.putImageData(S.animFrames[S.animCurrent],0,0);animDrawOnion()}
function animStop(){S.animPlaying=false}
async function animExport(){if(S.animFrames.length<2){toast('Add at least 2 frames first');return}animSaveFrame();if(!window.MediaRecorder){toast('This device cannot export videos');return}
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
  try{
    const stream=canvas.captureStream(30);const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];const mt=types.find(t=>MediaRecorder.isTypeSupported(t));
    const rec=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:4e6}:{});
    const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    const done=new Promise(r=>{rec.onstop=r});
    rec.start();
    const totalFrames=S.animFrames.length;
    for(let cycle=0;cycle<2;cycle++){for(let i=0;i<totalFrames;i++){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.putImageData(S.animFrames[i],0,0);await new Promise(r=>setTimeout(r,1000/S.animFps))}}
    await new Promise(r=>setTimeout(r,200));rec.stop();await done;
    const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});
    if(blob.size){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kidoodle-cartoon.'+(blob.type.includes('mp4')?'mp4':'webm');document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);toast('Animation saved! 🎬');sfx.tada()}
  }catch(e){console.error('[animExport]',e);toast('Could not export video')}
}
function animEnter(){
  if(S.animation)return;
  if(replaying)return;
  S.animation=true;S.animFrames=[];S.animCurrent=0;
  S.animFrames.push(actx.getImageData(0,0,W,H));
  animShowBar(true);animUpdateLabel();animDrawOnion();
  document.querySelectorAll('.btn').forEach(b=>{if(['bUndo','bRedo','bMovie'].includes(b.id))b.disabled=true});
  $('#bAnimate').classList.add('hot');
  refreshUI();sfx.tada();

function closeSheet(){modal.hidden=true;sheet.innerHTML='';if(sheetClose){const f=sheetClose;sheetClose=null;f()}if(lastFocusBeforeModal&&lastFocusBeforeModal.focus){try{lastFocusBeforeModal.focus({preventScroll:true})}catch(e){}}lastFocusBeforeModal=null}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!modal.hidden){closeSheet();return}
  if(e.key==='Tab'&&!modal.hidden){
    const f=Array.from(sheet.querySelectorAll('button:not(:disabled), [href], input:not(:disabled), select, textarea, [tabindex]:not([tabindex="-1"])')).filter(el=>el.offsetParent!==null);
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo()}
  else if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();doRedo()}
});

async function playMovie(record){

  $('#mbar').hidden=false;$('#mmsg').textContent=record?'Recording your movie…':'Playing your movie…';$('#ring').style.display='none';
  let total=0;acts.forEach(a=>{if(a.t==='s')total+=a.pts.length/2;else if(a.t==='trace')a.strokes.forEach(s=>total+=s.pts.length/2)});
  const secs=clamp(total/110,6,24),per=Math.max(1,Math.ceil(total/(60*secs)));
  let comp=null,rec=null,chunks=[],done=Promise.resolve();
  const drawComp=()=>{comp.getContext('2d').drawImage(composite(),0,0)};
  if(record){try{comp=document.createElement('canvas');comp.width=W;comp.height=H;const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'],mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));rec=new MediaRecorder(comp.captureStream(30),mt?{mimeType:mt,videoBitsPerSecond:4e6}:{});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};done=new Promise(r=>{rec.onstop=r});drawComp();rec.start()}catch(e){rec=null;comp=null;toast('This device can’t save videos, playing it instead.')}}
  const tick=async()=>{if(comp)drawComp();await frame();if(comp)drawComp()};
  const pause=async ms=>{const t0=performance.now();while(performance.now()-t0<ms&&!stopFlag)await tick()};
  await tick();

    if(a.t==='s'){const st=new Stroke(actx,a),n=a.pts.length/2;for(let i=0;i<n&&!stopFlag;){for(let k=0;k<per&&i<n;k++,i++)st.point(a.pts[i*2],a.pts[i*2+1]);await tick()}}
    else if(a.t==='trace'){for(const s of a.strokes){if(stopFlag)break;const st=new Stroke(actx,s),n=s.pts.length/2;for(let i=0;i<n&&!stopFlag;){for(let k=0;k<3&&i<n;k++,i++)st.point(s.pts[i*2],s.pts[i*2+1]);await tick()}}}
    else if(a.t==='f'){floodFill(actx,LA,a.x,a.y,a.c,a.p);sfx.fill();await pause(260)}
    else if(a.t==='x'){actx.clearRect(0,0,W,H);await pause(300)}
  }

}

async function loadImageFromFile(file){
  if(typeof createImageBitmap==='function'){
    try{const bm=await Promise.race([createImageBitmap(file),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),30000))]);return bm}
    catch(e){console.warn('[upload] createImageBitmap:',e)}
  }
  if(typeof URL!=='undefined'&&URL.createObjectURL){
    try{const url=URL.createObjectURL(file);try{return await new Promise((res,rej)=>{const im=new Image();const to=setTimeout(()=>rej(new Error('timeout')),30000);im.onload=()=>{clearTimeout(to);res(im)};im.onerror=()=>{clearTimeout(to);rej(new Error('decode'))};im.src=url})}finally{setTimeout(()=>{try{URL.revokeObjectURL(url)}catch(e){}},1000)}}
    catch(e){console.warn('[upload] URL.createObjectURL:',e)}
  }
  const dataURL=await new Promise((res,rej)=>{const fr=new FileReader();const to=setTimeout(()=>rej(new Error('timeout')),30000);fr.onload=()=>{clearTimeout(to);res(fr.result)};fr.onerror=()=>{clearTimeout(to);rej(new Error('read'))};fr.readAsDataURL(file)});
  return await loadImage(dataURL,30000)
}

async function handleUploadFile(file){
  if(replaying||!file)return;
  if(file.type&&!file.type.startsWith('image/')){toast('Please pick a picture file.');return}
  const MAX_BYTES=25*1024*1024;
  if(file.size>MAX_BYTES){toast('That photo is too big (over 25 MB). Try a smaller one.');return}
  if(!modal.hidden)closeSheet();
  // Read File into a data URL immediately, before any async work or input reset can revoke a content:// permission
  setUploadStatus('Reading file…');
  let dataURL;
  try{dataURL=await new Promise((res,rej)=>{const fr=new FileReader();const to=setTimeout(()=>rej(new Error('read timeout')),60000);fr.onload=()=>{clearTimeout(to);res(fr.result)};fr.onerror=()=>{clearTimeout(to);rej(new Error('read error'))};fr.readAsDataURL(file)})}
  catch(err){console.error('[upload] read:',err);setUploadStatus('');toast('Could not read that file. Try a different photo.');return}
  setUploadStatus('Decoding image…');
  let img;
  try{img=await loadImage(dataURL,30000)}
  catch(err){console.error('[upload] decode:',err);setUploadStatus('');toast('That picture could not be opened. Try a different one.');return}
  const iw=img.naturalWidth||img.width||1,ih=img.naturalHeight||img.height||1;
  if(!iw||!ih){setUploadStatus('');toast('That picture seems to be empty.');return}
  if(iw<50||ih<50){setUploadStatus('');toast('That picture is too small. Try a bigger one.');return}
  setUploadStatus('Preparing…');
  const src=document.createElement('canvas');src.width=W;src.height=H;
  const sctx=src.getContext('2d');sctx.fillStyle='#fff';sctx.fillRect(0,0,W,H);
  const sc=Math.min(W/iw,H/ih),dw=iw*sc,dh=ih*sc;
  sctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
  setUploadStatus('');
  openUploadDialog(src);
}

  S.id=null;S.actions=[];S.undo=[];S.redo=[];S.title='';
  actx.clearRect(0,0,W,H);lctx.clearRect(0,0,W,H);LA=null;
  if(mode==='trace'){lctx.globalAlpha=.32;lctx.drawImage(srcCanvas,0,0,W,H);lctx.globalAlpha=1;LA=null;S.page='upload';setTool('brush');toast('Trace over the picture!');sfx.pick()}
  else{
    let analysis=cachedAnalysis;if(!analysis){try{analysis=analyzeImage(srcCanvas,opts)}catch(e){console.error('[applyUpload]',e);toast('Could not analyse that picture.');return}}
    lctx.drawImage(analysis.lineCanvas,0,0);LA=analysis.alpha;S.page='upload';
    if(mode==='auto'){
      let trace=cachedTrace;if(!trace){try{trace=buildAutoTrace(srcCanvas,opts)}catch(e){console.error('[applyUpload] trace',e);toast('Could not trace that picture.');return}}
      const before=snap();const action={t:'trace',strokes:trace.strokes,mode:'auto'};applyTraceAction(actx,action);commit(action,before);setTool('fill');toast(`Traced ${trace.strokes.length} lines — colour them in!`);sfx.tada()
    }else{setTool('fill');toast('Ready to colour — tap a region to fill!');sfx.tada()}
  }
  refreshUI();saveNow();
}

/* ============ PARENT MENU ============ */
async function showParentGate(){
  const a=4+Math.floor(Math.random()*5),b=4+Math.floor(Math.random()*5),answer=a*b;
  openSheet('Grown-ups only',body=>{
    body.innerHTML=`<p class="note">Please solve to continue.</p><div style="font-size:2rem;font-weight:700;text-align:center;margin:18px 0;letter-spacing:3px">${a} × ${b} = ?</div><input type="number" id="pgAns" inputmode="numeric" style="width:100%;font:700 1.4rem system-ui;padding:14px;text-align:center;border:3px solid var(--line);border-radius:14px;background:var(--surface-2);color:var(--ink)" aria-label="Answer"><div class="bigbtns" style="margin-top:14px"><button class="big" id="pgCancel">Cancel</button><button class="big hot" id="pgOk">Continue</button></div>`;
    const check=()=>{const v=parseInt(body.querySelector('#pgAns').value,10);if(v===answer){closeSheet();setTimeout(openParentMenu,150)}else{body.querySelector('#pgAns').style.borderColor='var(--err)';body.querySelector('#pgAns').value='';body.querySelector('#pgAns').focus()}};
    body.querySelector('#pgOk').onclick=check;body.querySelector('#pgCancel').onclick=closeSheet;
    body.querySelector('#pgAns').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
    setTimeout(()=>body.querySelector('#pgAns').focus(),80);
  },{narrow:true});
}
function blobToBase64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)})}
async function exportBackup(){
  const list=await DB.all();
  const items=[];
  for(const r of list){
    let pngB64=null;if(r.png){try{pngB64=await blobToBase64(r.png)}catch(e){}}
    items.push({id:r.id,ts:r.ts,page:r.page,v:r.v,title:r.title,thumb:r.thumb,actions:r.actions||[],png:pngB64,lines:r.lines,mode:r.mode});
  }
  const data={app:'kidoodle-studio',version:2,exportedAt:Date.now(),items};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kidoodle-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  toast('Backup saved ✓');
}
function openParentMenu(){
  openSheet('Grown-ups',body=>{
    const voiceLocked=localStorage.getItem('kd.voiceLocked')==='1';
    body.innerHTML=`
      <div class="bigbtns">
        <button class="big" id="pExport"><span class="ic">💾</span>Export backup</button>
        <button class="big" id="pVoice"><span class="ic">${voiceLocked?'🔓':'🔒'}</span>${voiceLocked?'Unlock voice':'Lock voice off'}</button>
        <button class="big" id="pPrivacy"><span class="ic">🔒</span>Privacy info</button>
        <button class="big hot" id="pDelete"><span class="ic">🗑️</span>Delete all data</button>
      </div>
      <p class="note">All artwork is stored only on this device. Nothing is sent to a server. Deleting browser data for this page also deletes all artwork.</p>`;
    body.querySelector('#pExport').onclick=()=>{exportBackup()};
    body.querySelector('#pVoice').onclick=()=>{if(voiceLocked){localStorage.removeItem('kd.voiceLocked');toast('Voice unlocked');}else{localStorage.setItem('kd.voiceLocked','1');try{speechSynthesis.cancel()}catch(e){}toast('Voice locked off');}closeSheet()};
    body.querySelector('#pPrivacy').onclick=()=>{openPrivacy()};
    body.querySelector('#pDelete').onclick=async()=>{if(await confirmSheet('Delete everything?','All artwork and settings will be removed. This cannot be undone.','Delete it','⚠️')){await DB.clear();try{localStorage.clear()}catch(e){}S.actions=[];S.undo=[];S.redo=[];S.id=null;S.title='';actx.clearRect(0,0,W,H);savePill.classList.remove('show');closeSheet();refreshUI();toast('All data deleted')}};
  },{narrow:true});
}
function openPrivacy(){
  openSheet('Privacy',body=>{
    body.innerHTML=`<div class="note" style="line-height:1.6">
      <p><strong>Your child's privacy is simple:</strong></p>
      <ul style="padding-left:20px">
        <li>All artwork is stored <strong>only on this device</strong> (in the browser's local database).</li>
        <li>Nothing is sent to any server. No accounts. No tracking. No ads. No analytics.</li>
        <li>Photos you upload are processed entirely in your browser. They are never transmitted.</li>
        <li>This app does not know your child's name, location, or anything else about them.</li>
        <li>Clearing your browser data (or using "Delete all data" above) removes everything permanently.</li>
        <li>Voice is optional and can be locked off above so the child cannot re-enable it.</li>
      </ul>
      <p>To back up before deleting, use <strong>Export backup</strong>.</p>
    </div>`;
  },{narrow:true});
}

$('#bUndo').addEventListener('click',doUndo);$('#bRedo').addEventListener('click',doRedo);

$('#aNext').addEventListener('click',()=>animGoto(S.animCurrent+1));

// Long press on logo → parent gate
(()=>{
  const logo=$('#logoBtn');let pressTimer=null;
  const down=()=>{clearTimeout(pressTimer);pressTimer=setTimeout(()=>{showParentGate()},900)};
  const up=()=>{clearTimeout(pressTimer)};
  logo.addEventListener('pointerdown',down);
  logo.addEventListener('pointerup',up);
  logo.addEventListener('pointerleave',up);
  logo.addEventListener('pointercancel',up);
  logo.addEventListener('contextmenu',e=>e.preventDefault());
})();
// Visibility / unload save
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
window.addEventListener('pagehide',()=>{saveNow()});
// File input
$('#fileIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f){try{e.target.value=''}catch(err){}return}
  await handleUploadFile(f);
  try{e.target.value=''}catch(err){}
});
// Clipboard paste
document.addEventListener('paste',async e=>{
  const items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  for(const item of items){if(item.kind==='file'&&item.type&&item.type.startsWith('image/')){const f=item.getAsFile();if(f){e.preventDefault();await handleUploadFile(f);return}}}
});
// Drag & drop
stage.addEventListener('dragover',e=>{e.preventDefault();stage.classList.add('dragover')});
stage.addEventListener('dragleave',()=>stage.classList.remove('dragover'));
stage.addEventListener('drop',async e=>{e.preventDefault();stage.classList.remove('dragover');const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)await handleUploadFile(f)});

// Logo colours
(function logo(){const cols=['#ff3b30','#ff9500','#f2b700','#34c759','#0a84ff','#9b5de5','#f15bb5','#ff3b30'],el=$('#logoLetters');'Kidoodle'.split('').forEach((ch,i)=>{const s=document.createElement('i');s.textContent=ch;s.style.color=cols[i];s.style.setProperty('--rot',((i%2?4:-4))+'deg');s.style.setProperty('--dy',(i%2?1:-1)+'px');el.appendChild(s)})})();

buildPalette();
setColor(S.color,COLORS.find(c=>c[0]===S.color)?COLORS.find(c=>c[0]===S.color)[1]:nearestName(S.color),true);
$('#size').value=S.size;updateBrushPreview();updateCursorRing();setTool('brush');refreshUI();fit();

  console.log('[boot] protocol:',location.protocol,'| IndexedDB:',typeof indexedDB,'| MediaRecorder:',typeof MediaRecorder,'| version: 4 (schema v2)');
  const list=await DB.all();
  if(list.length){await openRecord(list[0]);toast('Welcome back! Here is your last picture.');saveSet('saved')}
  else{openHome();saveSet('hide')}
  window.__kd={S,actx,lctx,octx,snap,newPicture,doFillAt,playMovie,saveNow,saveSet,DB,composite,getLA:()=>LA,analyzeImage,buildAutoTrace,handleUploadFile,loadImageFromFile,animEnter,animExit};
})();
